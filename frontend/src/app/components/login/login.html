<div class="d-flex align-items-center justify-content-center" style="min-height: 90vh;">

  <div class="card p-4 shadow" style="width: 100%; max-width: 380px;">

    <h3 class="text-center mb-1">SCRMS</h3>
    <p class="text-center text-muted mb-4">Admin Panel Login</p>

    <div *ngIf="error" class="alert alert-danger py-2">{{ error }}</div>

    <form (ngSubmit)="submit()">

      <div class="mb-3">
        <label class="form-label">Username</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="username"
          name="username"
          autocomplete="username">
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
        {{ loading ? 'Logging in…' : 'Log In' }}
      </button>

    </form>

  </div>

</div>
