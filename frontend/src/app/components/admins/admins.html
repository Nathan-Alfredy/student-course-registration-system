<h2>Admins</h2>

<div class="mb-3">
  <input
    type="text"
    class="form-control"
    placeholder="Search by name or username..."
    [(ngModel)]="searchText">
</div>

<div class="card p-3 mb-4">

  <h4>{{ isEditing ? 'Edit Admin' : 'Add Admin' }}</h4>

  <div class="row">

    <div class="col-md-6 mb-2">
      <input
        class="form-control"
        placeholder="First Name"
        [(ngModel)]="newAdmin.firstName">
    </div>

    <div class="col-md-6 mb-2">
      <input
        class="form-control"
        placeholder="Last Name"
        [(ngModel)]="newAdmin.lastName">
    </div>

    <div class="col-md-4 mb-2">
      <select class="form-select" [(ngModel)]="newAdmin.gender">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>
    </div>

    <div class="col-md-4 mb-2">
      <input
        type="date"
        class="form-control"
        [(ngModel)]="newAdmin.dateOfBirth">
    </div>

    <div class="col-md-4 mb-2">
      <input
        class="form-control"
        placeholder="Phone"
        [(ngModel)]="newAdmin.phone">
    </div>

    <div class="col-md-6 mb-2">
      <input
        type="email"
        class="form-control"
        placeholder="Email"
        [(ngModel)]="newAdmin.email">
    </div>

    <div class="col-md-6 mb-2">
      <input
        class="form-control"
        placeholder="Employee Number"
        [(ngModel)]="newAdmin.employeeNumber">
    </div>

    <div class="col-md-6 mb-2">
      <input
        class="form-control"
        placeholder="Username"
        [(ngModel)]="newAdmin.username">
    </div>

    <div class="col-md-6 mb-2">
      <input
        type="password"
        class="form-control"
        [placeholder]="isEditing ? 'Leave blank to keep current password' : 'Password'"
        [(ngModel)]="newAdmin.password">
    </div>

    <div class="mt-3">
      <button
        *ngIf="!isEditing"
        class="btn btn-success me-2"
        (click)="saveAdmin()">
        Save Admin
      </button>

      <button
        *ngIf="isEditing"
        class="btn btn-warning me-2"
        (click)="updateAdmin()">
        Update Admin
      </button>

      <button
        *ngIf="isEditing"
        class="btn btn-secondary"
        (click)="cancelEdit()">
        Cancel
      </button>
    </div>

  </div>

</div>

<table class="table table-bordered table-striped">

  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Employee No.</th>
      <th>Username</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>

    <tr *ngFor="let admin of filteredAdmins()">
      <td>{{ admin.id }}</td>
      <td>{{ admin.firstName }} {{ admin.lastName }}</td>
      <td>{{ admin.employeeNumber }}</td>
      <td>{{ admin.username }}</td>
      <td>{{ admin.email }}</td>
      <td>{{ admin.phone }}</td>
      <td>
        <button
          class="btn btn-warning btn-sm me-2"
          (click)="editAdmin(admin)">
          Edit
        </button>
        <button
          class="btn btn-danger btn-sm"
          (click)="deleteAdmin(admin.id)">
          Delete
        </button>
      </td>
    </tr>

  </tbody>

</table>
