
<h2>Students</h2>

<button class="btn btn-primary mb-3">
  Add Student
</button>

<div class="mb-3">
  <input
    type="text"
    class="form-control"
    placeholder="Search by first name, last name or registration number..."
    [(ngModel)]="searchText">
</div>

<div class="card p-3 mb-4">

  <h4>Add Student</h4>

  <div class="row">

    <div class="col-md-6 mb-2">
      <input 
        class="form-control"
        placeholder="First Name"
        [(ngModel)]="newStudent.firstName">
    </div>

    <div class="col-md-6 mb-2">
      <input 
        class="form-control"
        placeholder="Last Name"
        [(ngModel)]="newStudent.lastName"> 
    </div>

    <div class="col-md-6 mb-2">
      <input 
        class="form-control"
        placeholder="Registration Number"
        [(ngModel)]="newStudent.registrationNumber">
    </div>

    <div class="col-md-6 mb-2">
      <input 
        class="form-control"
        placeholder="Program"
        [(ngModel)]="newStudent.program">
    </div>
    <div class="mt-3">

  <div class="mt-3">

  <button
    *ngIf="!isEditing"
    class="btn btn-success me-2"
    (click)="saveStudent()">
    Save Student
  </button>

  <button
    *ngIf="isEditing"
    class="btn btn-warning me-2"
    (click)="updateStudent()">
    Update Student
  </button>

  <button
    *ngIf="isEditing"
    class="btn btn-secondary"
    (click)="cancelEdit()">
    Cancel
  </button>


   </div>
    </div>
    

  </div>

</div>

<table class="table table-bordered table-striped">

  <thead>
    <tr>
      <th>ID</th>
      <th>Registration Number</th>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Program</th>
    </tr>
  </thead>

  <tbody>

    <tr *ngFor="let student of filteredStudents()">
      <td>{{student.id}}</td>
      <td>{{student.registrationNumber}}</td>
      <td>{{student.firstName}}</td>
      <td>{{student.lastName}}</td>
      <td>{{student.program}}</td>
      
      <button
      class="btn btn-danger btn-sm"
      (click)="deleteStudent(student.id)">
      Delete
      </button>

      <button
      class="btn btn-warning btn-sm me-2"
      (click)="editStudent(student)">
      Edit
      </button>
      


    </tr>

    
  </tbody>

</table>
